<p-toast position="bottom-right" />
<p-confirmdialog />

<div class="teacher-header">
    <h2>Docentes</h2>
    <p-button label="Agregar Nuevo" variant="outlined" severity="success" icon="pi pi-plus" (onClick)="onAddNew()" />
</div>

<app-table [columns]="columns" [httpService]="httpTeacherService" [service]="teacherService" (onEdit)="onEdit($event)" (onDelete)="onDelete($event)" (onRow)="onRow($event)"></app-table>

<p-dialog [header]="newTeacher ? 'Agregar nuevo docente' : 'Editar docente'" [modal]="true" [(visible)]="visible"
    [style]="{ width: '25rem' }">
    <form [formGroup]="form">
        <div class="input-container">
            <label for="name">Nombre</label>
            <input pInputText id="name" autocomplete="off" formControlName="name" />
        </div>
        <div class="buttons-container">
            <p-button label="Cancelar" severity="secondary" (click)="closeDialog()" />
            <p-button label="Guardar" (click)="onSave()" [disabled]="form.invalid || loading" />
        </div>
    </form>
</p-dialog>
